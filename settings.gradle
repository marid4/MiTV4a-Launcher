pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.android.application') {
                def gv = gradle.gradleVersion
                def agp = (gv.startsWith("7.0") || gv.startsWith("7.1") || gv.startsWith("7.2") || gv.startsWith("7.3") || gv.startsWith("7.4")) ? "7.3.1" : (gv.startsWith("7.") ? "7.4.2" : "8.2.2")
                useModule("com.android.tools.build:gradle:${agp}")
            }
        }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "CrbLauncher"
include ':app'
